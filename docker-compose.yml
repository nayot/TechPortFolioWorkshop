services:
  app:
    build:
      context: .
      args:
        VITE_BASE: /techportfolio/
    image: techportfolio:latest
    container_name: techportfolio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      # Bind only to the host loopback so the container is reachable
      # exclusively via your host's reverse proxy (nginx).
      - "127.0.0.1:3010:3000"
    volumes:
      - sessions:/app/sessions
      - admindata:/app/data

volumes:
  sessions:
  admindata:
