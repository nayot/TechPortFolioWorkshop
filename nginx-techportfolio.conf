# nginx include for Tech Portfolio — drop in /etc/nginx/includes/techportfolio.conf
# Then add this to your server block:  include /etc/nginx/includes/techportfolio.conf;

# Redirect bare path to trailing-slash so assets resolve correctly
location = /techportfolio {
    return 301 /techportfolio/;
}

location /techportfolio/ {
    proxy_pass         http://127.0.0.1:3010/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 20m;
}
